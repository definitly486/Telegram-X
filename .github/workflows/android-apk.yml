name: Telegram X APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/session-backup-restore
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SIGNING_CONFIGURED: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs wget make cmake ninja-build python3
          git lfs install
          git lfs pull

      - name: Set up Telegram X native dependencies and Android SDK
        run: bash scripts/setup.sh

      - name: Configure release signing
        if: env.SIGNING_CONFIGURED == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
          cat > keystore.properties <<EOF
          keystore.file=$RUNNER_TEMP/signing/release.jks
          keystore.password=$KEYSTORE_PASSWORD
          key.alias=$KEY_ALIAS
          key.password=$KEY_PASSWORD
          EOF

      - name: Build signed release APK
        if: env.SIGNING_CONFIGURED == 'true'
        run: ./gradlew --no-daemon --stacktrace assembleUniversalRelease

      - name: Build installable debug APK (signing secrets not configured)
        if: env.SIGNING_CONFIGURED != 'true'
        run: ./gradlew --no-daemon --stacktrace assembleUniversalDebug

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p dist
          find app/build/outputs/apk -type f -name '*.apk' -print -exec cp '{}' dist/ \;
          test -n "$(find dist -type f -name '*.apk' -print -quit)"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telegram-x-apk-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.SIGNING_CONFIGURED == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
