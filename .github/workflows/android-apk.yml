name: Telegram X APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/session-backup-restore
    tags:
      - "v*"

permissions:
  contents: write

# Avoid several expensive native Android builds racing after rapid commits.
concurrency:
  group: telegram-x-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SIGNING_CONFIGURED: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: recursive
          fetch-depth: 1
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs wget make cmake ninja-build python3
          git lfs install
          git lfs pull

      - name: Prepare signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
            cat > "$RUNNER_TEMP/signing/keystore.properties" <<EOF
          keystore.file=$RUNNER_TEMP/signing/release.jks
          keystore.password=$KEYSTORE_PASSWORD
          key.alias=$KEY_ALIAS
          key.password=$KEY_PASSWORD
          EOF
          else
            : > "$RUNNER_TEMP/signing/keystore.properties"
          fi

      - name: Set up Telegram X native dependencies and Android SDK
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          KEYSTORE_FILE: ${{ runner.temp }}/signing/keystore.properties
          APP_ID: org.thunderdog.challegram
          APP_NAME: Telegram X
          APP_DOWNLOAD_URL: https://github.com/definitly486/Telegram-X/releases
          APP_SOURCES_URL: https://github.com/definitly486/Telegram-X
        run: |
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ]; then
            echo "::error::Add TELEGRAM_API_ID and TELEGRAM_API_HASH repository secrets before building."
            exit 1
          fi
          bash scripts/setup.sh --default-sdk-root
          if [ "$SIGNING_CONFIGURED" != "true" ]; then
            printf '\napp.disable_signing=true\n' >> local.properties
          fi

      - name: Build universal release APK
        run: |
          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            ./gradlew --no-daemon --stacktrace assembleUniversalRelease
          else
            ./gradlew --no-daemon --stacktrace assembleUniversalRelease assembleUniversalDebug
          fi

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p dist
          find app/build/outputs/apk -type f -name '*.apk' -print -exec cp '{}' dist/ \;
          test -n "$(find dist -type f -name '*.apk' -print -quit)"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telegram-x-apk-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.SIGNING_CONFIGURED == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
